<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D WebAR Experience | sjar.vercel.app</title>
  <meta name="description" content="100% free app-less WebAR experience powered by MindAR.js and A-Frame on sjar.vercel.app" />

  <!-- OpenGraph -->
  <meta property="og:title" content="3D WebAR Experience | sjar.vercel.app" />
  <meta property="og:description" content="Scan the tracking target to launch interactive 3D WebAR directly in your mobile browser." />
  <meta property="og:url" content="https://sjar.vercel.app" />

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="./css/styles.css" />

  <!-- A-Frame Library (v1.5.0) -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR Image Library for A-Frame (v1.2.5) -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- Three.js OrbitControls fallback scripts -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>

  <!-- Application Script -->
  <script src="./js/app.js" defer></script>
</head>
<body>

  <!-- Top Glassmorphic Navigation & Status Bar -->
  <header id="app-header" class="glass-panel">
    <div class="brand-badge">
      <i class="fas fa-cube"></i>
      <span>ShivamAI 3D</span>
    </div>
    <div id="status-pill" class="status-pill searching">
      <div class="status-dot"></div>
      <span id="status-text">Scanning Target...</span>
    </div>
  </header>

  <!-- Camera Reticle Scanning Guidance Frame -->
  <div id="scanning-reticle">
    <div class="reticle-corner reticle-top-left"></div>
    <div class="reticle-corner reticle-top-right"></div>
    <div class="reticle-corner reticle-bottom-left"></div>
    <div class="reticle-corner reticle-bottom-right"></div>
    <div class="reticle-line"></div>
  </div>

  <!-- Main WebAR Scene Container -->
  <a-scene
    id="ar-scene"
    mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: true; uiScanning: no; uiLoading: no;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true, exposure: 1.2"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>

    <a-assets>
      <!-- Load 3D GLB Model asset -->
      <a-asset-item id="glbModel" src="./assets/model.glb"></a-asset-item>
    </a-assets>

    <!-- Camera setup -->
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Target 0: QR Target tracking anchor -->
    <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
      
      <!-- Lighting -->
      <a-entity light="type: ambient; color: #ffffff; intensity: 1.2"></a-entity>
      <a-entity light="type: directional; color: #38bdf8; intensity: 2" position="2 4 3"></a-entity>

      <!-- 3D GLTF Model entity -->
      <a-gltf-model
        id="3d-model-entity"
        src="#glbModel"
        position="0 0 0"
        rotation="0 0 0"
        scale="0.6 0.6 0.6">
      </a-gltf-model>
    </a-entity>
  </a-scene>

  <!-- 3D Orbit Preview Canvas (Fallback when camera isn't used) -->
  <div id="orbit-canvas-container"></div>

  <!-- Bottom Floating Interactive Control Bar -->
  <nav id="control-bar" class="glass-panel">
    <button id="btn-spin" class="btn-icon active" title="Toggle Auto-Spin">
      <i class="fas fa-sync-alt"></i>
    </button>
    <button id="btn-color" class="btn-icon" title="Change Color Palette">
      <i class="fas fa-palette"></i>
    </button>
    <button id="btn-scale-up" class="btn-icon" title="Scale Up">
      <i class="fas fa-search-plus"></i>
    </button>
    <button id="btn-scale-down" class="btn-icon" title="Scale Down">
      <i class="fas fa-search-minus"></i>
    </button>
    <button id="btn-reset" class="btn-icon" title="Reset View">
      <i class="fas fa-undo"></i>
    </button>
    <button id="btn-audio" class="btn-icon active" title="Toggle Audio Chime">
      <i class="fas fa-volume-up"></i>
    </button>
    <button id="btn-mode" class="btn-pill">
      <i class="fas fa-cube"></i>
      <span>3D Preview</span>
    </button>
  </nav>

  <!-- Camera Guidance Modal -->
  <div id="permission-modal" class="modal-overlay">
    <div class="modal-card glass-panel">
      <div class="modal-icon">
        <i class="fas fa-camera"></i>
      </div>
      <h2 class="modal-title">ShivamAI WebAR Access</h2>
      <p class="modal-desc">
        Point your camera at the target QR code to view the 3D model in Augmented Reality.
      </p>
      <div style="font-size: 0.85rem; color: #38bdf8; display: flex; gap: 16px;">
        <a href="./target.html" target="_blank" style="color: #38bdf8; text-decoration: underline;">
          <i class="fas fa-qrcode"></i> View Target QR
        </a>
        <a href="./compiler.html" target="_blank" style="color: #38bdf8; text-decoration: underline;">
          <i class="fas fa-cog"></i> Target Compiler
        </a>
      </div>
      <div class="modal-actions">
        <button id="btn-start-ar" class="btn-pill" style="width: 100%; justify-content: center;">
          <i class="fas fa-play"></i> Start Scanning
        </button>
      </div>
    </div>
  </div>

</body>
</html>
