<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  <title>Shivam Jewels - 80th Independence Day WebAR Experience</title>
  
  <!-- A-Frame (3D rendering framework) and MindAR (WebAR image tracking) -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image-aframe.prod.js"></script>
  
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Montserrat', 'Segoe UI', Roboto, sans-serif;
      background-color: #050b14;
    }
    
    /* Loading & UI Overlay */
    #ar-overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      left: 0;
      top: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
      box-sizing: border-box;
      padding: 40px 20px;
    }
    
    /* Glassmorphism Invitation Card (Slides up when AR triggers) */
    .glass-card {
      background: rgba(5, 12, 24, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 215, 0, 0.35);
      border-radius: 20px;
      padding: 25px;
      width: 90%;
      max-width: 360px;
      color: #ffffff;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(255, 215, 0, 0.15);
      pointer-events: auto;
      transform: translateY(150%);
      transition: transform 1.2s cubic-bezier(0.19, 1, 0.22, 1), opacity 1.2s ease;
      opacity: 0;
    }
    
    .glass-card.visible {
      transform: translateY(0);
      opacity: 1;
    }
    
    .brand-title {
      font-size: 1.4rem;
      letter-spacing: 4px;
      color: #ffd700;
      margin: 0 0 5px 0;
      text-transform: uppercase;
      font-weight: 700;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
    }
    
    .brand-subtitle {
      font-size: 0.8rem;
      letter-spacing: 2px;
      color: #e2e8f0;
      margin-bottom: 20px;
      text-transform: uppercase;
    }
    
    .card-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.6), transparent);
      margin: 15px 0;
    }
    
    .invitation-text {
      font-size: 0.9rem;
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 20px;
    }
    
    .ar-btn {
      background: linear-gradient(135deg, #ffd700 0%, #b8860b 100%);
      border: none;
      color: #000;
      padding: 12px 30px;
      font-size: 0.9rem;
      font-weight: bold;
      letter-spacing: 2px;
      border-radius: 30px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
      transition: all 0.3s ease;
    }
    
    .ar-btn:active {
      transform: scale(0.95);
    }
    
    /* Tracking instructions */
    .instruction-box {
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 215, 0, 0.2);
      border-radius: 30px;
      padding: 12px 24px;
      color: #fff;
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      gap: 10px;
      transition: opacity 0.5s ease;
      pointer-events: auto;
    }
    
    /* Pulsing camera scan target reticle */
    .scan-target {
      position: absolute;
      width: 280px;
      height: 380px;
      border: 2px dashed rgba(255, 215, 0, 0.4);
      border-radius: 20px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 5;
      transition: opacity 0.5s ease;
    }
    
    .scan-target::before {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      border-top: 4px solid #ffd700;
      border-left: 4px solid #ffd700;
      top: -2px;
      left: -2px;
      border-top-left-radius: 10px;
    }
    
    .scan-target::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      border-bottom: 4px solid #ffd700;
      border-right: 4px solid #ffd700;
      bottom: -2px;
      right: -2px;
      border-bottom-right-radius: 10px;
    }
    
    /* Developer Simulation Trigger */
    #dev-control {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 20;
      pointer-events: auto;
    }
    
    .sim-btn {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 215, 0, 0.4);
      backdrop-filter: blur(5px);
      color: #ffd700;
      padding: 8px 16px;
      font-size: 0.75rem;
      border-radius: 30px;
      cursor: pointer;
      letter-spacing: 1px;
      font-weight: bold;
      transition: all 0.3s ease;
    }
    
    .sim-btn:hover {
      background: rgba(255, 215, 0, 0.2);
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
    }
  </style>
  
  <script>
    // --- 1. Custom Antigravity Bobbing and Rotation Component ---
    AFRAME.registerComponent('antigravity', {
      schema: {
        bobSpeed: {type: 'number', default: 0.0015},
        bobAmp: {type: 'number', default: 0.08},
        rotSpeed: {type: 'number', default: 0.3}
      },
      init: function() {
        this.initialY = this.el.object3D.position.y;
      },
      tick: function(time, timeDelta) {
        // Smooth sinusoidal bobbing (antigravity float effect)
        const newY = this.initialY + (Math.sin(time * this.data.bobSpeed) * this.data.bobAmp);
        this.el.object3D.position.y = newY;
        
        // Slow, luxurious gold rotation
        this.el.object3D.rotation.y += (this.data.rotSpeed * Math.PI / 180);
      }
    });

    // --- 2. Tricolor Particle Generator (Rising Energy Particles) ---
    AFRAME.registerComponent('rising-particles', {
      init: function() {
        this.particleCount = 60;
        this.colors = ['#FF9933', '#FFFFFF', '#138808', '#FFD700']; // Saffron, White, Green, Gold
        this.particles = [];
        
        for (let i = 0; i < this.particleCount; i++) {
          const el = document.createElement('a-entity');
          
          // Spawning positions in a cylinder around the center portal
          const radius = Math.random() * 1.0;
          const angle = Math.random() * Math.PI * 2;
          const x = Math.cos(angle) * radius;
          const y = (Math.random() * 2.5) - 1.25;
          const z = (Math.sin(angle) * radius);
          
          el.setAttribute('geometry', {
            primitive: 'sphere',
            radius: Math.random() * 0.015 + 0.005
          });
          
          // Distribute Indian Tricolor & Luxury Gold
          const color = this.colors[Math.floor(Math.random() * this.colors.length)];
          el.setAttribute('material', {
            color: color,
            shader: 'flat',
            opacity: Math.random() * 0.7 + 0.3
          });
          
          el.setAttribute('position', { x, y, z });
          this.el.appendChild(el);
          
          this.particles.push({
            el: el,
            speed: Math.random() * 0.006 + 0.003,
            amplitude: Math.random() * 0.04,
            phase: Math.random() * Math.PI * 2,
            initialX: x,
            initialZ: z
          });
        }
      },
      tick: function(time, timeDelta) {
        this.particles.forEach(p => {
          let pos = p.el.getAttribute('position');
          if (!pos) return;
          
          // Rising physics
          pos.y += p.speed;
          
          // Floating sway
          pos.x = p.initialX + Math.sin(time * 0.002 + p.phase) * p.amplitude;
          
          // Reset at top threshold to generate infinite flow loop
          if (pos.y > 1.5) {
            pos.y = -1.25;
            pos.x = p.initialX;
          }
          p.el.setAttribute('position', pos);
        });
      }
    });

    // --- AR Target Camera Event Listeners ---
    document.addEventListener("DOMContentLoaded", () => {
      const targetEl = document.querySelector('#ar-target');
      const glassCard = document.querySelector('.glass-card');
      const instruction = document.querySelector('.instruction-box');
      const scanReticle = document.querySelector('.scan-target');
      
      if (targetEl) {
        // Detected! (60-75% area visible)
        targetEl.addEventListener("targetFound", () => {
          glassCard.classList.add('visible');
          instruction.style.opacity = '0';
          scanReticle.style.opacity = '0';
        });
        
        // Tracking lost
        targetEl.addEventListener("targetLost", () => {
          glassCard.classList.remove('visible');
          instruction.style.opacity = '1';
          scanReticle.style.opacity = '1';
        });
      }
    });

    // Developer Simulator Function
    function toggleSimulation() {
      const glassCard = document.querySelector('.glass-card');
      const instruction = document.querySelector('.instruction-box');
      const scanReticle = document.querySelector('.scan-target');
      const simBtn = document.querySelector('.sim-btn');
      const portalNode = document.querySelector('#portal-group');
      
      if (glassCard.classList.contains('visible')) {
        glassCard.classList.remove('visible');
        instruction.style.opacity = '1';
        scanReticle.style.opacity = '1';
        portalNode.setAttribute('visible', 'false');
        simBtn.innerText = "Simulate Scan (On)";
      } else {
        glassCard.classList.add('visible');
        instruction.style.opacity = '0';
        scanReticle.style.opacity = '0';
        portalNode.setAttribute('visible', 'true');
        simBtn.innerText = "Simulate Scan (Off)";
      }
    }
  </script>
</head>
<body>
  <!-- Camera Viewport Interactive Elements -->
  <div id="ar-overlay">
    <div class="instruction-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" stroke="#ffd700" stroke-width="2"/>
        <path d="M12 8V12M12 16H12.01" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
      </svg>
      Point camera at Shivam Jewels Invitation Card (60%+ Visible)
    </div>
    
    <div class="scan-target"></div>
    
    <div class="glass-card">
      <h1 class="brand-title">Shivam Jewels</h1>
      <p class="brand-subtitle">Celebrating 80 Years of Freedom</p>
      <div class="card-divider"></div>
      <p class="invitation-text">
        "Celebrating the spirit of freedom, craftsmanship, heritage, and timeless elegance."
        Explore our signature <strong>Independence Day Collection</strong> and legacy portfolio.
      </p>
      <button class="ar-btn" onclick="window.open('https://shivamjewels.com', '_blank')">Explore Collection</button>
    </div>
  </div>

  <!-- Developer HUD: Click this button in your browser to inspect animations immediately! -->
  <div id="dev-control">
    <button class="sim-btn" onclick="toggleSimulation()">Simulate Scan (On)</button>
  </div>

  <!-- WebAR Scene Pipeline -->
  <a-scene mindar-image="imageTargetSrc: ./compiled_targets.mind; autoStart: true; filterMinCF:0.0001; filterBeta: 0.001;" 
           color-space="sRGB" 
           renderer="colorManagement: true, physicallyCorrectLights: true" 
           vr-mode-ui="enabled: false" 
           device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    
    <!-- Dynamic AR Target Coordinate Entity -->
    <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
      <a-entity id="portal-group" position="0 0 0" visible="false">
        
        <!-- 1. Diamond-Facet Wireframe Rings (Portal Base) -->
        <a-entity id="portal-facets" antigravity="rotSpeed: -0.15; bobAmp: 0.04;">
          <a-ring color="#FFD700" radius-inner="0.65" radius-outer="0.68" opacity="0.8" rotation="90 0 0"></a-ring>
          <a-ring color="#138808" radius-inner="0.85" radius-outer="0.87" opacity="0.5" rotation="45 45 0"></a-ring>
          <a-ring color="#FF9933" radius-inner="0.85" radius-outer="0.87" opacity="0.5" rotation="-45 45 0"></a-ring>
        </a-entity>
        
        <!-- 2. The 3D Ashoka Chakra (Crystal & Gold Mesh Assembly) -->
        <a-entity id="ashoka-chakra-mesh" position="0 0 0.05" scale="0.5 0.5 0.5" antigravity="rotSpeed: 0.25; bobAmp: 0.06;">
          <a-torus color="#FFD700" radius="0.8" tube="0.04" material="roughness: 0.15; metalness: 0.95;"></a-torus>
          <a-cylinder color="#FFD700" radius="0.15" height="0.1" rotation="90 0 0" material="roughness: 0.15; metalness: 0.95;"></a-cylinder>
          
          <!-- Core Spokes -->
          <a-box color="#FF9933" width="0.02" height="1.5" depth="0.02" rotation="0 0 0"></a-box>
          <a-box color="#FFFFFF" width="0.02" height="1.5" depth="0.02" rotation="0 0 45"></a-box>
          <a-box color="#138808" width="0.02" height="1.5" depth="0.02" rotation="0 0 90"></a-box>
          
          <!-- Extra spokes populated programmatically -->
          <a-box color="#FFD700" width="0.015" height="1.5" depth="0.015" rotation="0 0 15" opacity="0.7"></a-box>
          <a-box color="#FFD700" width="0.015" height="1.5" depth="0.015" rotation="0 0 30" opacity="0.7"></a-box>
          <a-box color="#FFD700" width="0.015" height="1.5" depth="0.015" rotation="0 0 60" opacity="0.7"></a-box>
          <a-box color="#FFD700" width="0.015" height="1.5" depth="0.015" rotation="0 0 75" opacity="0.7"></a-box>
          <a-box color="#FFD700" width="0.015" height="1.5" depth="0.015" rotation="0 0 105" opacity="0.7"></a-box>
          <a-box color="#FFD700" width="0.015" height="1.5" depth="0.015" rotation="0 0 120" opacity="0.7"></a-box>
          <a-box color="#FFD700" width="0.015" height="1.5" depth="0.015" rotation="0 0 135" opacity="0.7"></a-box>
          <a-box color="#FFD700" width="0.015" height="1.5" depth="0.015" rotation="0 0 150" opacity="0.7"></a-box>
          <a-box color="#FFD700" width="0.015" height="1.5" depth="0.015" rotation="0 0 165" opacity="0.7"></a-box>
        </a-entity>
        
        <!-- 3. Dynamic Rising Antigravity Particle Stream -->
        <a-entity id="antigravity-particles" rising-particles></a-entity>
        
        <!-- Ambient and reflective lighting -->
        <a-light type="ambient" color="#ffffff" intensity="0.5"></a-light>
        <a-light type="directional" color="#ffd700" intensity="1.2" position="1 2 1"></a-light>
        <a-light type="point" color="#138808" intensity="0.8" position="-1 -1 1"></a-light>
        <a-light type="point" color="#FF9933" intensity="0.8" position="1 -1 1"></a-light>
        
      </a-entity>
    </a-entity>
  </scene>
</body>
</html>
