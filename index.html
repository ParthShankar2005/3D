<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D WebAR Experience | sjar.vercel.app</title>
  <meta name="description" content="100% free app-less WebAR experience powered by MindAR.js and A-Frame on sjar.vercel.app" />

  <!-- OpenGraph -->
  <meta property="og:title" content="3D WebAR Experience | sjar.vercel.app" />
  <meta property="og:description" content="Scan the tracking target to launch interactive 3D WebAR directly in your mobile browser." />
  <meta property="og:url" content="https://sjar.vercel.app" />

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="./css/styles.css" />

  <!-- A-Frame Library (v1.5.0) -->
  <script src="./js/aframe.min.js"></script>

  <!-- MindAR Image Library for A-Frame (v1.2.5) -->
  <script src="./js/mindar-image-aframe.prod.js"></script>

  <!-- Three.js OrbitControls fallback scripts -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>

  <!-- Real-Time Camera QR Code Reader Library -->
  <script src="./js/jsQR.js"></script>

  <!-- Application Script -->
  <script src="./js/app.js" defer></script>
</head>
<body>

  <!-- Top Glassmorphic Navigation & Status Bar -->
  <header id="app-header" class="glass-panel">
    <div class="brand-badge">
      <i class="fas fa-gem" style="color: #38bdf8;"></i>
      <span>Shivam Jewels</span>
    </div>
    <div id="status-pill" class="status-pill searching">
      <div class="status-dot"></div>
      <span id="status-text">Scanning Target...</span>
    </div>
  </header>

  <!-- Camera Reticle & Translucent QR Target Overlay -->
  <div id="scanning-reticle" class="hidden">
    <div class="reticle-corner reticle-top-left"></div>
    <div class="reticle-corner reticle-top-right"></div>
    <div class="reticle-corner reticle-bottom-left"></div>
    <div class="reticle-corner reticle-bottom-right"></div>
    
    <!-- Transparent QR Target Guide Image -->
    <div class="qr-target-preview-wrapper">
      <img src="./assets/target.png" alt="QR Target Preview" class="qr-target-preview-img" />
    </div>
    
    <div class="reticle-line"></div>
    <div class="scanning-label">
      <i class="fas fa-qrcode"></i> Point Camera at QR Target
    </div>
  </div>

  <!-- Main WebAR Scene Container -->
  <a-scene
    id="ar-scene"
    mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: false; uiScanning: no; uiLoading: no;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true, exposure: 1.2"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>

    <a-assets>
      <!-- Load 3D GLTF Gem Model asset -->
      <a-asset-item id="glbModel" src="./assets/model.gltf"></a-asset-item>
      <!-- Load Shivam Jewels Thank You Banner Image asset -->
      <img id="shivamBanner" src="./assets/shivam_banner.png" />
    </a-assets>

    <!-- Camera setup -->
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Target 0: QR Target tracking anchor -->
    <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
      
      <!-- Ambient & Specular Gem Lighting -->
      <a-entity light="type: ambient; color: #ffffff; intensity: 1.6"></a-entity>
      <a-entity light="type: directional; color: #38bdf8; intensity: 2.5" position="2 4 3"></a-entity>
      <a-entity light="type: directional; color: #f59e0b; intensity: 1.5" position="-2 -2 2"></a-entity>

      <!-- 1. Shivam Jewels Thank You Poster Banner Overlapping QR Code Target (Perfect 1:1 QR Aspect) -->
      <a-plane
        id="banner-plane"
        src="#shivamBanner"
        position="0 0 0"
        rotation="0 0 0"
        width="1.0"
        height="1.25"
        material="transparent: true; side: double; shader: flat;">
      </a-plane>

      <!-- 2. Hyper-Realistic Floating & Rotating 3D Diamond Model on the Upside of the Picture -->
      <a-gltf-model
        id="3d-model-entity"
        src="#glbModel"
        position="0 0.95 0.15"
        rotation="0 0 0"
        scale="0.65 0.65 0.65"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear"
        animation__float="property: position; from: 0 0.85 0.15; to: 0 1.05 0.15; dir: alternate; loop: true; dur: 1600; easing: easeInOutSine">
      </a-gltf-model>

      <!-- 3. Floating 3D Text Badge: SHIVAM JEWELS Above the Diamond -->
      <a-entity position="0 1.6 0.15" animation="property: position; from: 0 1.5 0.15; to: 0 1.7 0.15; dir: alternate; loop: true; dur: 1600; easing: easeInOutSine">
        <a-text
          value="SHIVAM JEWELS"
          align="center"
          color="#f59e0b"
          width="4.2"
          wrap-count="14"
          side="double">
        </a-text>
        <a-text
          value="JCK LAS VEGAS"
          position="0 -0.22 0"
          align="center"
          color="#38bdf8"
          width="2.6"
          wrap-count="20"
          side="double">
        </a-text>
      </a-entity>
    </a-entity>
  </a-scene>

  <!-- Camera Permission Modal -->
  <div id="permission-modal" class="modal-overlay">
    <div class="modal-card glass-panel">
      <div class="modal-icon">
        <i class="fas fa-gem"></i>
      </div>
      <h2 class="modal-title">Shivam Jewels WebAR</h2>
      <p class="modal-desc">
        Point your phone camera at the QR target code to reveal the floating 3D diamond experience in Augmented Reality.
      </p>
      <div class="modal-actions">
        <button id="btn-start-ar" class="btn-pill btn-primary-lg">
          <i class="fas fa-video"></i> Allow Camera & Start WebAR
        </button>
      </div>
    </div>
  </div>

</body>
</html>
