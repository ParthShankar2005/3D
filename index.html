<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Shivam Jewels - 80th Independence Day WebAR Experience</title>
    
    <!-- 1. Google Fonts & Design Styles -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- 2. Importmap for Three.js (r160) and MindAR -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
    </script>

    <style>
      :root {
        --primary-gold: #d4af37;
        --accent-glow: #ffd700;
        --bg-dark: rgba(10, 12, 18, 0.85);
        --glass-border: rgba(212, 175, 55, 0.3);
      }

      * {
        box-sizing: border-box;
        user-select: none;
      }

      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #050608;
        font-family: 'Montserrat', sans-serif;
        color: #ffffff;
      }

      #container {
        width: 100vw;
        height: 100vh;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
      }

      /* HUD Glass Overlay */
      #hud-header {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        background: var(--bg-dark);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--glass-border);
        border-radius: 30px;
        padding: 10px 24px;
        display: flex;
        align-items: center;
        gap: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 15px rgba(212, 175, 55, 0.15);
      }

      .brand-title {
        font-family: 'Cinzel', serif;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 2px;
        color: #fff;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .brand-title span {
        color: var(--primary-gold);
      }

      /* Controls Panel */
      #control-panel {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        background: var(--bg-dark);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
        border-radius: 20px;
        padding: 14px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        width: 90%;
        max-width: 480px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      }

      .btn-group {
        display: flex;
        gap: 10px;
        width: 100%;
      }

      button {
        flex: 1;
        padding: 12px 16px;
        font-family: 'Montserrat', sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 1px;
        text-transform: uppercase;
        border: 1px solid var(--primary-gold);
        border-radius: 12px;
        background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(0, 0, 0, 0.6));
        color: #ffffff;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      button:hover {
        background: linear-gradient(135deg, rgba(212, 175, 55, 0.5), rgba(212, 175, 55, 0.1));
        box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        transform: translateY(-2px);
      }

      button.active {
        background: var(--primary-gold);
        color: #000;
        box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
      }

      /* Gem Color Pickers */
      .color-selector {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 12px;
        color: #ccc;
        letter-spacing: 0.5px;
      }

      .color-swatch {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 2px solid transparent;
        cursor: pointer;
        transition: transform 0.2s, border-color 0.2s;
      }

      .color-swatch:hover, .color-swatch.selected {
        transform: scale(1.25);
        border-color: #fff;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      }

      /* Card Overlay Blueprint Frame */
      #scanner-blueprint {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 280px;
        height: 420px;
        border: 2px dashed rgba(212, 175, 55, 0.4);
        border-radius: 16px;
        pointer-events: none;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.5s ease;
      }

      #scanner-blueprint::after {
        content: "ALIGN INVITATION CARD HERE";
        font-family: 'Cinzel', serif;
        font-size: 11px;
        letter-spacing: 2px;
        color: rgba(212, 175, 55, 0.7);
        text-align: center;
        background: rgba(0, 0, 0, 0.6);
        padding: 6px 12px;
        border-radius: 8px;
      }

      .hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>

    <!-- Top Header -->
    <div id="hud-header">
      <div class="brand-title">💎 Shivam <span>Jewels</span></div>
    </div>

    <!-- Alignment Scanner Wireframe -->
    <div id="scanner-blueprint"></div>

    <!-- Main Container for MindAR + Three.js -->
    <div id="container"></div>

    <!-- Bottom Controls Panel -->
    <div id="control-panel">
      <div class="btn-group">
        <button id="startButton">▶ Start AR</button>
        <button id="stopButton">⏸ Pause</button>
        <button id="bypassButton">🔍 WebGL Preview</button>
      </div>

      <div class="color-selector">
        <span>Diamond Grade:</span>
        <div class="color-swatch selected" data-color="0xffffff" style="background: radial-gradient(circle, #ffffff, #e0f7fa);" title="D-Flawless Pure White"></div>
        <div class="color-swatch" data-color="0xffd700" style="background: radial-gradient(circle, #ffe082, #ffb300);" title="Fancy Intense Yellow"></div>
        <div class="color-swatch" data-color="0x29b6f6" style="background: radial-gradient(circle, #e0f7fa, #0288d1);" title="Rare Blue Diamond"></div>
        <div class="color-swatch" data-color="0xf48fb1" style="background: radial-gradient(circle, #fce4ec, #d81b60);" title="Argyle Pink Diamond"></div>
      </div>
    </div>

    <script type="module">
      import * as THREE from 'three';
      import { MindARThree } from 'mindar-image-three';
      import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

      let mindarThree = null;
      let renderer, scene, camera, anchor;
      let diamondMesh, lightGroup, pointLights = [];
      let isBypassMode = false;
      let animationFrameId = null;

      // ----------------------------------------------------
      // 1. CREATE FACETED NATURAL BRILLIANT DIAMOND GEOMETRY
      // ----------------------------------------------------
      function createDiamondGeometry() {
        const geom = new THREE.BufferGeometry();
        
        // Key landmark points of a round brilliant cut diamond
        const apexTop = [0, 0.45, 0];        // Table top peak
        const apexBottom = [0, -0.65, 0];    // Culet (bottom point)
        
        const numFacets = 16;
        const crownRadius = 0.55;
        const girdleRadius = 0.75;
        const crownHeight = 0.25;
        const girdleHeight = 0.0;
        const pavilionHeight = -0.45;

        const vertices = [];

        // Generate girdle & crown vertices around radius
        for (let i = 0; i < numFacets; i++) {
          const angle1 = (i / numFacets) * Math.PI * 2;
          const angle2 = ((i + 1) / numFacets) * Math.PI * 2;

          // Upper Crown Table Vertices
          const x1_c = Math.cos(angle1) * crownRadius;
          const z1_c = Math.sin(angle1) * crownRadius;
          const x2_c = Math.cos(angle2) * crownRadius;
          const z2_c = Math.sin(angle2) * crownRadius;

          // Girdle Edge Vertices
          const x1_g = Math.cos(angle1) * girdleRadius;
          const z1_g = Math.sin(angle1) * girdleRadius;
          const x2_g = Math.cos(angle2) * girdleRadius;
          const z2_g = Math.sin(angle2) * girdleRadius;

          // 1. Table Top Facets (Triangles from center table to crown)
          vertices.push(...apexTop, x1_c, crownHeight, z1_c, x2_c, crownHeight, z2_c);

          // 2. Crown Upper Bezel Facets (Quads split into 2 triangles)
          vertices.push(x1_c, crownHeight, z1_c, x1_g, girdleHeight, z1_g, x2_g, girdleHeight, z2_g);
          vertices.push(x1_c, crownHeight, z1_c, x2_g, girdleHeight, z2_g, x2_c, crownHeight, z2_c);

          // 3. Pavilion Lower Facets (Triangles from girdle to bottom culet)
          vertices.push(x1_g, girdleHeight, z1_g, apexBottom[0], apexBottom[1], apexBottom[2], x2_g, girdleHeight, z2_g);
        }

        geom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        geom.computeVertexNormals();
        return geom;
      }

      // ----------------------------------------------------
      // 2. HIGH-END PHYSICAL DIAMOND SHADER MATERIAL
      // ----------------------------------------------------
      function createDiamondMaterial(colorHex = 0xffffff, envMap = null) {
        return new THREE.MeshPhysicalMaterial({
          color: new THREE.Color(colorHex),
          emissive: new THREE.Color(0x050a15),
          roughness: 0.0,            // Mirror polished surface
          metalness: 0.0,            // Pure dielectric gemstone
          transmission: 0.98,        // High optical transparency for inner sparkle
          ior: 2.417,                // Exact Refractive Index of Natural Diamond
          reflectivity: 1.0,         // Maximum surface reflection
          clearcoat: 1.0,            // Extra outer polish layer
          clearcoatRoughness: 0.0,
          dispersion: 0.06,          // Physical chromatic dispersion (Fire & Rainbow splits)
          thickness: 1.2,            // Internal refraction ray length
          flatShading: true,         // Sharp facet reflections!
          envMap: envMap,
          envMapIntensity: 3.5,
          transparent: true,
          opacity: 1.0
        });
      }

      // ----------------------------------------------------
      // 3. STUDIO LIGHTING SYSTEM & ENVIRONMENT SETUP
      // ----------------------------------------------------
      function setupDiamondLighting(targetScene, rendererInstance) {
        lightGroup = new THREE.Group();

        // Ambient Fill
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        lightGroup.add(ambientLight);

        // Key Overhead Spotlight for Brilliance
        const keyLight = new THREE.DirectionalLight(0xffffff, 3.5);
        keyLight.position.set(2, 4, 3);
        lightGroup.add(keyLight);

        // Colored Orbiting Point Lights to provoke Chromatic Fire & Sparkles
        const lightColors = [0xffd700, 0x00ffff, 0xff007f, 0x76ff03];
        pointLights = [];

        lightColors.forEach((col, idx) => {
          const pLight = new THREE.PointLight(col, 2.5, 5);
          pLight.userData = {
            angle: (idx / lightColors.length) * Math.PI * 2,
            speed: 0.02 + idx * 0.005,
            radius: 1.8 + idx * 0.2,
            baseY: 0.3 * Math.sin(idx)
          };
          lightGroup.add(pLight);
          pointLights.push(pLight);
        });

        targetScene.add(lightGroup);

        // Generate Studio Environment Map for photorealistic reflections
        const pmremGenerator = new THREE.PMREMGenerator(rendererInstance);
        pmremGenerator.compileEquirectangularShader();
        const roomEnv = new RoomEnvironment();
        const envTexture = pmremGenerator.fromScene(roomEnv).texture;
        pmremGenerator.dispose();

        return envTexture;
      }

      // ----------------------------------------------------
      // 4. INITIALIZATION & WEBAR SETUP
      // ----------------------------------------------------
      async function initWebAR() {
        mindarThree = new MindARThree({
          container: document.querySelector("#container"),
          imageTargetSrc: "https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind"
        });

        renderer = mindarThree.renderer;
        scene = mindarThree.scene;
        camera = mindarThree.camera;

        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;

        // Anchor setup on physical card target
        anchor = mindarThree.addAnchor(0);

        // Set up Studio Lighting & EnvMap
        const envMap = setupDiamondLighting(scene, renderer);

        // Build Diamond 3D Mesh
        const diamondGeo = createDiamondGeometry();
        const diamondMat = createDiamondMaterial(0xffffff, envMap);
        diamondMesh = new THREE.Mesh(diamondGeo, diamondMat);

        diamondMesh.scale.set(0.65, 0.65, 0.65);
        diamondMesh.position.set(0, 0.2, 0);

        // Add Floating Halo Ring under the Diamond
        const ringGeo = new THREE.TorusGeometry(0.85, 0.015, 16, 64);
        const ringMat = new THREE.MeshStandardMaterial({
          color: 0xd4af37,
          metalness: 0.9,
          roughness: 0.1,
          emissive: 0x554000
        });
        const haloRing = new THREE.Mesh(ringGeo, ringMat);
        haloRing.rotation.x = Math.PI / 2;

        const gemGroup = new THREE.Group();
        gemGroup.add(diamondMesh);
        gemGroup.add(haloRing);

        anchor.group.add(gemGroup);

        // Start MindAR
        await mindarThree.start();

        // Main Render & Animation Loop
        renderer.setAnimationLoop(() => {
          animateDiamond();
          renderer.render(scene, camera);
        });

        document.querySelector("#scanner-blueprint").classList.remove("hidden");
      }

      // Animation Loop logic
      function animateDiamond() {
        if (diamondMesh) {
          diamondMesh.rotation.y += 0.008;
          diamondMesh.rotation.x = Math.sin(Date.now() * 0.001) * 0.15;
        }

        // Orbit point lights for dynamic facet sparkle
        pointLights.forEach((pLight) => {
          pLight.userData.angle += pLight.userData.speed;
          pLight.position.x = Math.cos(pLight.userData.angle) * pLight.userData.radius;
          pLight.position.z = Math.sin(pLight.userData.angle) * pLight.userData.radius;
          pLight.position.y = pLight.userData.baseY + Math.sin(pLight.userData.angle * 2) * 0.2;
        });
      }

      // ----------------------------------------------------
      // 5. EVENT LISTENERS & INTERACTIVE HUD
      // ----------------------------------------------------
      document.querySelector("#startButton").addEventListener("click", async () => {
        if (!mindarThree) {
          await initWebAR();
        } else {
          await mindarThree.start();
          renderer.setAnimationLoop(() => {
            animateDiamond();
            renderer.render(scene, camera);
          });
        }
        document.querySelector("#scanner-blueprint").classList.remove("hidden");
      });

      document.querySelector("#stopButton").addEventListener("click", () => {
        if (mindarThree) {
          mindarThree.stop();
          renderer.setAnimationLoop(null);
        }
        document.querySelector("#scanner-blueprint").classList.add("hidden");
      });

      // WebGL Direct Preview Bypass
      document.querySelector("#bypassButton").addEventListener("click", () => {
        isBypassMode = !isBypassMode;
        const btn = document.querySelector("#bypassButton");

        if (isBypassMode) {
          btn.classList.add("active");
          document.querySelector("#scanner-blueprint").classList.add("hidden");

          if (!renderer) {
            // Standalone Three.js fallback render if MindAR isn't started yet
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.querySelector("#container").appendChild(renderer.domElement);

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 0.5, 2.5);

            const envMap = setupDiamondLighting(scene, renderer);
            const diamondGeo = createDiamondGeometry();
            const diamondMat = createDiamondMaterial(0xffffff, envMap);
            diamondMesh = new THREE.Mesh(diamondGeo, diamondMat);
            scene.add(diamondMesh);
          } else {
            camera.position.set(0, 0.5, 2.5);
            camera.lookAt(0, 0, 0);
          }

          renderer.setAnimationLoop(() => {
            animateDiamond();
            renderer.render(scene, camera);
          });
        } else {
          btn.classList.remove("active");
          document.querySelector("#scanner-blueprint").classList.remove("hidden");
        }
      });

      // Gem Color Picker Selection
      document.querySelectorAll(".color-swatch").forEach((swatch) => {
        swatch.addEventListener("click", (e) => {
          document.querySelectorAll(".color-swatch").forEach(s => s.classList.remove("selected"));
          swatch.classList.add("selected");

          const colorHex = parseInt(swatch.getAttribute("data-color"));
          if (diamondMesh) {
            diamondMesh.material.color.setHex(colorHex);
          }
        });
      });

      // Auto start WebAR on page load
      window.addEventListener("DOMContentLoaded", () => {
        initWebAR().catch(err => {
          console.log("WebAR Auto-start awaiting user interaction:", err);
        });
      });
    </script>
  </body>
</html>
