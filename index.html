<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Shivam Jewels - 80th Independence Day WebAR Experience</title>
    
    <!-- 1. Google Fonts & Design Styles -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- 2. Importmap for Three.js (r160) and MindAR -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
    </script>

    <style>
      :root {
        --primary-gold: #d4af37;
        --accent-glow: #ffd700;
        --laser-cyan: #00f0ff;
        --bg-dark: rgba(10, 12, 18, 0.88);
        --glass-border: rgba(212, 175, 55, 0.35);
      }

      * {
        box-sizing: border-box;
        user-select: none;
      }

      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #050608;
        font-family: 'Montserrat', sans-serif;
        color: #ffffff;
      }

      #container {
        width: 100vw;
        height: 100vh;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
      }

      /* HUD Glass Header */
      #hud-header {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        background: var(--bg-dark);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--glass-border);
        border-radius: 30px;
        padding: 10px 24px;
        display: flex;
        align-items: center;
        gap: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 15px rgba(212, 175, 55, 0.15);
      }

      .brand-title {
        font-family: 'Cinzel', serif;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 2px;
        color: #fff;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .brand-title span {
        color: var(--primary-gold);
      }

      /* Stage Indicator Pill */
      #stage-badge {
        font-size: 11px;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 12px;
        background: rgba(0, 240, 255, 0.15);
        color: var(--laser-cyan);
        border: 1px solid rgba(0, 240, 255, 0.4);
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      /* Controls Panel */
      #control-panel {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        background: var(--bg-dark);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
        border-radius: 20px;
        padding: 14px 18px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        width: 92%;
        max-width: 520px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.7);
      }

      .btn-group {
        display: flex;
        gap: 8px;
        width: 100%;
      }

      button {
        flex: 1;
        padding: 10px 12px;
        font-family: 'Montserrat', sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        border: 1px solid var(--primary-gold);
        border-radius: 10px;
        background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(0, 0, 0, 0.6));
        color: #ffffff;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        white-space: nowrap;
      }

      button:hover {
        background: linear-gradient(135deg, rgba(212, 175, 55, 0.5), rgba(212, 175, 55, 0.1));
        box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        transform: translateY(-2px);
      }

      button.active {
        background: var(--primary-gold);
        color: #000;
        box-shadow: 0 0 18px rgba(255, 215, 0, 0.6);
      }

      button.stage-btn.active {
        background: var(--laser-cyan);
        color: #000;
        border-color: var(--laser-cyan);
        box-shadow: 0 0 18px rgba(0, 240, 255, 0.6);
      }

      /* Controls Sub-row */
      .sub-controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        gap: 12px;
        padding-top: 4px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }

      .color-selector {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        color: #ccc;
      }

      .color-swatch {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 2px solid transparent;
        cursor: pointer;
        transition: transform 0.2s, border-color 0.2s;
      }

      .color-swatch:hover, .color-swatch.selected {
        transform: scale(1.25);
        border-color: #fff;
        box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
      }

      /* Card Alignment Scanner Blueprint Wireframe */
      #scanner-blueprint {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 280px;
        height: 420px;
        border: 2px dashed rgba(212, 175, 55, 0.4);
        border-radius: 16px;
        pointer-events: none;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.5s ease;
      }

      #scanner-blueprint::after {
        content: "ALIGN INVITATION CARD HERE";
        font-family: 'Cinzel', serif;
        font-size: 11px;
        letter-spacing: 2px;
        color: rgba(212, 175, 55, 0.7);
        text-align: center;
        background: rgba(0, 0, 0, 0.6);
        padding: 6px 12px;
        border-radius: 8px;
      }

      .hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>

    <!-- Top Header -->
    <div id="hud-header">
      <div class="brand-title">💎 Shivam <span>Jewels</span></div>
      <div id="stage-badge">Evolution Mode</div>
    </div>

    <!-- Alignment Scanner Wireframe -->
    <div id="scanner-blueprint"></div>

    <!-- Main Container for MindAR + Three.js -->
    <div id="container"></div>

    <!-- Bottom Controls Panel -->
    <div id="control-panel">
      <!-- Main Action Buttons -->
      <div class="btn-group">
        <button id="startButton">▶ Start AR</button>
        <button id="stopButton">⏸ Pause</button>
        <button id="bypassButton">🔍 WebGL Preview</button>
      </div>

      <!-- Transformation Stage Buttons -->
      <div class="btn-group">
        <button class="stage-btn" id="btnStageRough">🪨 1. Rough</button>
        <button class="stage-btn active" id="btnStageTransform">⚡ 2. Morph Sweep</button>
        <button class="stage-btn" id="btnStagePolished">💎 3. Polished</button>
        <button class="stage-btn" id="btnStageAuto">🔄 Auto Loop</button>
      </div>

      <!-- Gem Color Selection -->
      <div class="sub-controls">
        <div class="color-selector">
          <span>Grade:</span>
          <div class="color-swatch selected" data-color="0xffffff" style="background: radial-gradient(circle, #ffffff, #e0f7fa);" title="D-Flawless Pure White"></div>
          <div class="color-swatch" data-color="0xffd700" style="background: radial-gradient(circle, #ffe082, #ffb300);" title="Fancy Intense Yellow"></div>
          <div class="color-swatch" data-color="0x29b6f6" style="background: radial-gradient(circle, #e0f7fa, #0288d1);" title="Rare Blue Diamond"></div>
          <div class="color-swatch" data-color="0xf48fb1" style="background: radial-gradient(circle, #fce4ec, #d81b60);" title="Argyle Pink Diamond"></div>
        </div>
      </div>
    </div>

    <script type="module">
      import * as THREE from 'three';
      import { MindARThree } from 'mindar-image-three';
      import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

      let mindarThree = null;
      let renderer, scene, camera, anchor;
      let roughMesh, polishedMesh, laserGroup, laserRing, laserLight;
      let lightGroup, pointLights = [];
      let isBypassMode = false;
      let envTexture = null;
      let transformGroup = null;

      // Morph States: 'rough', 'transform', 'polished', 'auto'
      let currentStage = 'transform';
      let autoLoopTime = 0;

      // ----------------------------------------------------
      // 1. ROUGH OCTAHEDRAL CRYSTAL GEOMETRY & MATERIAL
      // ----------------------------------------------------
      function createRoughDiamondGeometry() {
        const geom = new THREE.OctahedronGeometry(0.72, 1);
        const posAttr = geom.attributes.position;
        
        // Add subtle organic surface noise to imitate natural unpolished crystal
        for (let i = 0; i < posAttr.count; i++) {
          const vx = posAttr.getX(i);
          const vy = posAttr.getY(i);
          const vz = posAttr.getZ(i);

          const noise = (Math.sin(vx * 12.0) * Math.cos(vy * 12.0) * Math.sin(vz * 12.0)) * 0.045;
          posAttr.setXYZ(i, vx + noise, vy + noise, vz + noise);
        }

        geom.computeVertexNormals();
        return geom;
      }

      function createRoughDiamondMaterial() {
        return new THREE.MeshPhysicalMaterial({
          color: new THREE.Color(0xf5e6ca),   // Natural warm octahedral crystal tint
          emissive: new THREE.Color(0x332200),
          roughness: 0.38,
          metalness: 0.0,
          transmission: 0.65,                 // Semi-translucent raw stone
          ior: 2.1,
          thickness: 1.5,
          transparent: true,
          opacity: 0.9,
          flatShading: true
        });
      }

      // ----------------------------------------------------
      // 2. POLISHED ROUND BRILLIANT CUT GEOMETRY & MATERIAL
      // ----------------------------------------------------
      function createPolishedDiamondGeometry() {
        const geom = new THREE.BufferGeometry();
        const apexTop = [0, 0.45, 0];
        const apexBottom = [0, -0.65, 0];
        
        const numFacets = 16;
        const crownRadius = 0.55;
        const girdleRadius = 0.75;
        const crownHeight = 0.25;
        const girdleHeight = 0.0;

        const vertices = [];

        for (let i = 0; i < numFacets; i++) {
          const angle1 = (i / numFacets) * Math.PI * 2;
          const angle2 = ((i + 1) / numFacets) * Math.PI * 2;

          const x1_c = Math.cos(angle1) * crownRadius;
          const z1_c = Math.sin(angle1) * crownRadius;
          const x2_c = Math.cos(angle2) * crownRadius;
          const z2_c = Math.sin(angle2) * crownRadius;

          const x1_g = Math.cos(angle1) * girdleRadius;
          const z1_g = Math.sin(angle1) * girdleRadius;
          const x2_g = Math.cos(angle2) * girdleRadius;
          const z2_g = Math.sin(angle2) * girdleRadius;

          // Table Top Facets
          vertices.push(...apexTop, x1_c, crownHeight, z1_c, x2_c, crownHeight, z2_c);

          // Crown Upper Bezel Facets
          vertices.push(x1_c, crownHeight, z1_c, x1_g, girdleHeight, z1_g, x2_g, girdleHeight, z2_g);
          vertices.push(x1_c, crownHeight, z1_c, x2_g, girdleHeight, z2_g, x2_c, crownHeight, z2_c);

          // Pavilion Lower Facets
          vertices.push(x1_g, girdleHeight, z1_g, apexBottom[0], apexBottom[1], apexBottom[2], x2_g, girdleHeight, z2_g);
        }

        geom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        geom.computeVertexNormals();
        return geom;
      }

      function createPolishedDiamondMaterial(colorHex = 0xffffff, envMap = null) {
        return new THREE.MeshPhysicalMaterial({
          color: new THREE.Color(colorHex),
          emissive: new THREE.Color(0x050a15),
          roughness: 0.0,
          metalness: 0.0,
          transmission: 0.98,
          ior: 2.417,                // Exact Natural Diamond Refractive Index
          reflectivity: 1.0,
          clearcoat: 1.0,
          clearcoatRoughness: 0.0,
          dispersion: 0.06,          // Physical dispersion (Rainbow Fire)
          thickness: 1.2,
          flatShading: true,
          envMap: envMap,
          envMapIntensity: 3.5,
          transparent: true,
          opacity: 1.0
        });
      }

      // ----------------------------------------------------
      // 3. LASER SCANNING BEAM & SWEEP RING
      // ----------------------------------------------------
      function createLaserScannerGroup() {
        laserGroup = new THREE.Group();

        // Laser Ring
        const ringGeo = new THREE.TorusGeometry(0.85, 0.02, 16, 64);
        const ringMat = new THREE.MeshBasicMaterial({
          color: 0x00f0ff,
          transparent: true,
          opacity: 0.95
        });
        laserRing = new THREE.Mesh(ringGeo, ringMat);
        laserRing.rotation.x = Math.PI / 2;
        laserGroup.add(laserRing);

        // Laser Light Emission
        laserLight = new THREE.PointLight(0x00f0ff, 4.0, 3.0);
        laserGroup.add(laserLight);

        return laserGroup;
      }

      // ----------------------------------------------------
      // 4. STUDIO LIGHTING RIG & ENVIRONMENT SETUP
      // ----------------------------------------------------
      function setupLightingSystem(targetScene, rendererInstance) {
        lightGroup = new THREE.Group();

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        lightGroup.add(ambientLight);

        const keyLight = new THREE.DirectionalLight(0xffffff, 3.5);
        keyLight.position.set(2, 4, 3);
        lightGroup.add(keyLight);

        const lightColors = [0xffd700, 0x00ffff, 0xff007f, 0x76ff03];
        pointLights = [];

        lightColors.forEach((col, idx) => {
          const pLight = new THREE.PointLight(col, 2.5, 5);
          pLight.userData = {
            angle: (idx / lightColors.length) * Math.PI * 2,
            speed: 0.02 + idx * 0.005,
            radius: 1.8 + idx * 0.2,
            baseY: 0.3 * Math.sin(idx)
          };
          lightGroup.add(pLight);
          pointLights.push(pLight);
        });

        targetScene.add(lightGroup);

        const pmremGenerator = new THREE.PMREMGenerator(rendererInstance);
        pmremGenerator.compileEquirectangularShader();
        const roomEnv = new RoomEnvironment();
        const texture = pmremGenerator.fromScene(roomEnv).texture;
        pmremGenerator.dispose();

        return texture;
      }

      // ----------------------------------------------------
      // 5. ASSEMBLE DUAL-STATE TRANSFORMING GEMSTONE
      // ----------------------------------------------------
      function buildTransformingGemstone(envMap) {
        transformGroup = new THREE.Group();

        // 1. Rough Octahedron Mesh
        const roughGeo = createRoughDiamondGeometry();
        const roughMat = createRoughDiamondMaterial();
        roughMesh = new THREE.Mesh(roughGeo, roughMat);
        roughMesh.scale.set(0.65, 0.65, 0.65);
        roughMesh.position.set(0, 0.2, 0);
        transformGroup.add(roughMesh);

        // 2. Polished Brilliant Cut Mesh
        const polishedGeo = createPolishedDiamondGeometry();
        const polishedMat = createPolishedDiamondMaterial(0xffffff, envMap);
        polishedMesh = new THREE.Mesh(polishedGeo, polishedMat);
        polishedMesh.scale.set(0.65, 0.65, 0.65);
        polishedMesh.position.set(0, 0.2, 0);
        transformGroup.add(polishedMesh);

        // 3. Laser Scanner Ring
        const laser = createLaserScannerGroup();
        laser.position.set(0, 0.2, 0);
        transformGroup.add(laser);

        // 4. Outer Gold Halo Ring
        const haloGeo = new THREE.TorusGeometry(0.9, 0.015, 16, 64);
        const haloMat = new THREE.MeshStandardMaterial({
          color: 0xd4af37,
          metalness: 0.9,
          roughness: 0.1,
          emissive: 0x443300
        });
        const haloRing = new THREE.Mesh(haloGeo, haloMat);
        haloRing.rotation.x = Math.PI / 2;
        haloRing.position.set(0, -0.4, 0);
        transformGroup.add(haloRing);

        return transformGroup;
      }

      // ----------------------------------------------------
      // 6. ANIMATION & MORPH TRANSFORMATION LOOP
      // ----------------------------------------------------
      function updateTransformationLoop() {
        const time = Date.now() * 0.0015;

        // Gem Rotation
        if (transformGroup) {
          transformGroup.rotation.y += 0.008;
          transformGroup.rotation.x = Math.sin(time) * 0.12;
        }

        // Orbit point lights for facet sparkles
        pointLights.forEach((pLight) => {
          pLight.userData.angle += pLight.userData.speed;
          pLight.position.x = Math.cos(pLight.userData.angle) * pLight.userData.radius;
          pLight.position.z = Math.sin(pLight.userData.angle) * pLight.userData.radius;
          pLight.position.y = pLight.userData.baseY + Math.sin(pLight.userData.angle * 2) * 0.2;
        });

        // Handle Transformation Stages
        if (currentStage === 'auto') {
          autoLoopTime += 0.015;
          const cycle = (Math.sin(autoLoopTime) + 1) / 2; // 0 to 1 smooth oscillation
          applyMorphRatio(cycle);
        } else if (currentStage === 'rough') {
          applyMorphRatio(0.0);
        } else if (currentStage === 'polished') {
          applyMorphRatio(1.0);
        } else if (currentStage === 'transform') {
          // Sweeping sweep effect
          const sweep = (Math.sin(time * 2.0) + 1) / 2;
          applyMorphRatio(sweep);
        }
      }

      function applyMorphRatio(ratio) {
        // ratio: 0.0 (Pure Rough) -> 1.0 (Pure Polished)
        if (!roughMesh || !polishedMesh || !laserGroup) return;

        roughMesh.material.opacity = Math.max(0.0, 1.0 - ratio * 1.2);
        polishedMesh.material.opacity = Math.min(1.0, ratio * 1.2);
        roughMesh.visible = roughMesh.material.opacity > 0.02;
        polishedMesh.visible = polishedMesh.material.opacity > 0.02;

        // Laser Ring Y Sweep Position across diamond height (-0.5 to +0.5)
        const laserY = (ratio - 0.5) * 1.1;
        laserGroup.position.y = 0.2 + laserY;

        // Laser Intensity pulses during transformation phase
        const isLaserActive = (ratio > 0.05 && ratio < 0.95);
        laserGroup.visible = isLaserActive;
        if (isLaserActive) {
          laserLight.intensity = 3.0 + Math.sin(Date.now() * 0.02) * 1.5;
        }
      }

      // ----------------------------------------------------
      // 7. WEBAR INITIALIZATION
      // ----------------------------------------------------
      async function initWebAR() {
        mindarThree = new MindARThree({
          container: document.querySelector("#container"),
          imageTargetSrc: "https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind"
        });

        renderer = mindarThree.renderer;
        scene = mindarThree.scene;
        camera = mindarThree.camera;

        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.25;

        anchor = mindarThree.addAnchor(0);

        envTexture = setupLightingSystem(scene, renderer);
        const gem = buildTransformingGemstone(envTexture);
        anchor.group.add(gem);

        await mindarThree.start();

        renderer.setAnimationLoop(() => {
          updateTransformationLoop();
          renderer.render(scene, camera);
        });

        document.querySelector("#scanner-blueprint").classList.remove("hidden");
      }

      // ----------------------------------------------------
      // 8. EVENT LISTENERS & HUD UI CONTROLS
      // ----------------------------------------------------
      document.querySelector("#startButton").addEventListener("click", async () => {
        if (!mindarThree) {
          await initWebAR();
        } else {
          await mindarThree.start();
          renderer.setAnimationLoop(() => {
            updateTransformationLoop();
            renderer.render(scene, camera);
          });
        }
        document.querySelector("#scanner-blueprint").classList.remove("hidden");
      });

      document.querySelector("#stopButton").addEventListener("click", () => {
        if (mindarThree) {
          mindarThree.stop();
          renderer.setAnimationLoop(null);
        }
        document.querySelector("#scanner-blueprint").classList.add("hidden");
      });

      // WebGL Bypass Preview Mode
      document.querySelector("#bypassButton").addEventListener("click", () => {
        isBypassMode = !isBypassMode;
        const btn = document.querySelector("#bypassButton");

        if (isBypassMode) {
          btn.classList.add("active");
          document.querySelector("#scanner-blueprint").classList.add("hidden");

          if (!renderer) {
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.25;
            document.querySelector("#container").appendChild(renderer.domElement);

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 0.4, 2.4);

            envTexture = setupLightingSystem(scene, renderer);
            const gem = buildTransformingGemstone(envTexture);
            scene.add(gem);
          } else {
            camera.position.set(0, 0.4, 2.4);
            camera.lookAt(0, 0, 0);
          }

          renderer.setAnimationLoop(() => {
            updateTransformationLoop();
            renderer.render(scene, camera);
          });
        } else {
          btn.classList.remove("active");
          document.querySelector("#scanner-blueprint").classList.remove("hidden");
        }
      });

      // Stage Selection Logic
      const stageButtons = {
        'btnStageRough': 'rough',
        'btnStageTransform': 'transform',
        'btnStagePolished': 'polished',
        'btnStageAuto': 'auto'
      };

      Object.entries(stageButtons).forEach(([btnId, stageKey]) => {
        document.querySelector(`#${btnId}`).addEventListener("click", () => {
          document.querySelectorAll(".stage-btn").forEach(b => b.classList.remove("active"));
          document.querySelector(`#${btnId}`).classList.add("active");

          currentStage = stageKey;
          const badge = document.querySelector("#stage-badge");

          if (stageKey === 'rough') badge.textContent = "Raw Octahedron Crystal";
          else if (stageKey === 'transform') badge.textContent = "Laser Sweep Processing";
          else if (stageKey === 'polished') badge.textContent = "Flawless Brilliant Cut";
          else if (stageKey === 'auto') badge.textContent = "Continuous Evolution Loop";
        });
      });

      // Diamond Color Selector
      document.querySelectorAll(".color-swatch").forEach((swatch) => {
        swatch.addEventListener("click", () => {
          document.querySelectorAll(".color-swatch").forEach(s => s.classList.remove("selected"));
          swatch.classList.add("selected");

          const colorHex = parseInt(swatch.getAttribute("data-color"));
          if (polishedMesh) {
            polishedMesh.material.color.setHex(colorHex);
          }
        });
      });

      // Auto initialize WebAR on load
      window.addEventListener("DOMContentLoaded", () => {
        initWebAR().catch(err => {
          console.log("WebAR Auto-start awaiting user interaction:", err);
        });
      });
    </script>
  </body>
</html>
